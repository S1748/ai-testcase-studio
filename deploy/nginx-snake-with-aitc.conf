server {
    listen 80;
    listen 443 ssl;
    server_name makeming.site 49.232.27.220;

    ssl_certificate /etc/letsencrypt/live/makeming.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeming.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AITC_SSL:10m;
    ssl_session_timeout 1d;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /aitc {
        return 308 https://makeming.site/aitc/;
    }

    location ^~ /aitc/api/ {
        if ($scheme = http) {
            return 308 https://makeming.site$request_uri;
        }
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 25m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ^~ /aitc/assets/ {
        if ($scheme = http) {
            return 308 https://makeming.site$request_uri;
        }
        root /var/www;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /aitc/ {
        if ($scheme = http) {
            return 308 https://makeming.site$request_uri;
        }
        root /var/www;
        try_files $uri $uri/ /aitc/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 原有小游戏保持在根路径。
    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
